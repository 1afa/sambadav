<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in &ndash; {TITLE}</title>
    {STYLES}  </head>
  <body class="login-page">
    <main class="login-card" id="login">
      <div class="login-brand">{BRAND}</div>
      <h1>Sign in</h1>
      <form method="post" id="login-form">
        <label for="user">Username</label>
        <input type="text" id="user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" autocomplete="current-password" required>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="btn primary block"><span class="spinner" aria-hidden="true"></span><span>Sign in</span></button>
      </form>
    </main>
    <script>
    (function () {
      var form = document.getElementById('login-form');
      var card = document.getElementById('login');
      var user = document.getElementById('user');
      var pass = document.getElementById('pass');
      var err  = document.getElementById('login-error');

      // Without XMLHttpRequest the form still works as a plain POST:
      if (!form || !window.XMLHttpRequest) return;

      form.addEventListener('submit', function (ev) {
        // Do a behind-the-scenes basic auth login to the page with the
        // credentials from the form; this will cause them to be cached
        // by the browser and resent for the rest of the session.
        ev.preventDefault();

        // Clean location without query parameters:
        var cleanloc = document.location.protocol + '//' + document.location.host + document.location.pathname;
        var ajax = new XMLHttpRequest();

        err.hidden = true;
        card.classList.add('busy');

        ajax.onreadystatechange = function () {
          if (ajax.readyState !== 4) return;

          if (ajax.status === 200) {
            window.location = cleanloc;
            return;
          }
          card.classList.remove('busy');

          if (ajax.status === 401) {
            pass.value = '';
            pass.focus();
            err.textContent = 'Wrong username or password.';
          }
          else if (ajax.status === 0) {
            err.textContent = 'Could not reach the server.';
          }
          else {
            err.textContent = 'Could not sign in (error ' + ajax.status + ').';
          }
          err.hidden = false;
        };
        ajax.open('GET', cleanloc, true, user.value, pass.value);
        ajax.send(null);
      });
    })();
    </script>
  </body>
</html>
